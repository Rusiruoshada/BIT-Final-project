<div class="container-fluid">
	<div class="card border-0 shadow">
		<div class="p-4">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<!-- search bar  -->
					<div class="position-relative searchBarFroTable">
						<span class="position-absolute searchIcon">
							<i class="fa-solid fa-search text-secondary"></i>
						</span>
						<input
							type="text"
							name="searchInput"
							id="searchInput"
							class="form-control shadow-none searchInput"
							placeholder="Search here..."
						/>
					</div>
				</div>

				<button
					type="button"
					class="btn btn-primary"
					id="addNewPackageButton"
					data-bs-toggle="modal"
					data-bs-target="#addNewPackageFormModal"
				>
					<i class="fa-solid fa-plus"></i>
					New Package
				</button>
			</div>

			<!-- add new package modal -->

			<div
				class="modal fade"
				tabindex="-1"
				id="addNewPackageFormModal"
				aria-labelledby="employeeDetailFormLabel"
				aria-hidden="true"
				data-bs-backdrop="static"
				data-bs-keyboard="false"
			>
				<div
					class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg modal-fullscreen-sm-down"
				>
					<div class="modal-content">
						<div class="modal-header">
							<h4 class="modal-title">Add a New Package</h4>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"
							></button>
						</div>

						<div class="modal-body">
                            <div id="addNewPackageForm">
								<!-- package Selection modal will load here -->
                                
							</div>
						</div>

						<!-- reset button have to manually clear Fields -->
                        <!-- continue , reset buttons -->
						<div class="modal-footer">
							<div class="row">
								<div class="col-12">
									<div class="row">
										<div class="col-12 text-end">
											<button
												type="reset"
												class="btn btn-reset btn-outline-secondary fw-bold"
											>
												Reset
											</button>

											<button
												type="button"
												class="btn btn-primary fw-bold"
												id="addNewPackageSubmitButton"
											>
												Continue
											</button>
										</div>
									</div>
								</div>
							</div>
						</div>
						<!-- continue , reset buttons -->

					</div>
				</div>
			</div>

			<!-- add new package modal -->

			<!-- table goes here -->

			<div class="card-body p-0">
				<div class="table-responsive">
					<table
						class="table table-hover text-center align-middle bg-transparent"
					>
						<thead>
							<tr>
								
								<th scope="col" class="text-center align-middle">
									Package Name
								</th>
								<th scope="col" class="text-center align-middle">
									Category Name
								</th>
								<th scope="col" class="text-center align-middle">
									Package Cost
								</th>
								<th scope="col" class="text-center align-middle">Lesson Count</th>
								<th scope="col" class="text-center align-middle">Status</th>
								<th scope="col" class="text-center align-middle">Modify</th>
							</tr>
						</thead>
						<tbody id="packageDetailTableBody"></tbody>
					</table>
				</div>
			</div>

			<!-- table goes here -->

            <!-- card footer pagination and entries -->

			<div class="d-flex justify-content-between align-items-center mt-4">
				<div class="form-text">Showing 1 to 9 of 9 entries</div>
				<div class="btn-group gap-2">
					<nav aria-label="table navigation">
						<ul class="pagination text-primary">
							<li class="page-item">
								<a class="page-link" href="#" aria-label="Previous">
									<span aria-hidden="true">&laquo;</span>
								</a>
							</li>
							<li class="page-item">
								<a class="page-link active" href="#">1</a>
							</li>
							<li class="page-item"><a class="page-link" href="#">2</a></li>
							<li class="page-item"><a class="page-link" href="#">3</a></li>
							<li class="page-item">
								<a class="page-link" href="#" aria-label="Next">
									<span aria-hidden="true">&raquo;</span>
								</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>

            <!-- card footer pagination and entries -->

		</div>
	</div>
</div>
