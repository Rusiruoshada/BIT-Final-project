<div class="notification-body">
	<div
		class="modal fade"
		id="notificationModal"
		tabindex="-1"
		aria-hidden="true"
	>
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="notificationModalTitle"></h5>

					<button
						type="button"
						class="btn-close"
						data-bs-dismiss="modal"
						aria-label="Close"
						id="btn-close-modal"
					></button>
				</div>

				<div class="modal-body" id="modal-body">
					<div class="d-flex justify-content-between">
						<div class="mb-3">
							<small class="text-muted"> Date </small>

							<div id="notificationModalDate" class="fw-medium"></div>
						</div>

						<div class="mb-3 text-end">
							<small class="text-muted"> Status </small>

							<div>
								<span
									id="notificationModalStatus"
									class="fw-bold text-black"
								></span>
							</div>
						</div>
					</div>

					<div>
						<small class="text-muted"> Description </small>

						<p id="notificationModalDescription" class="mb-0"></p>
					</div>
				</div>

				<div class="modal-footer"></div>
			</div>
		</div>
	</div>
</div>

<!-- Notifications Modal here -->

<!-- Notification page content  -->
<div class="container-fluid py-4">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h3 class="mb-1">Notifications</h3>
			<p class="text-muted mb-0">View your latest notifications</p>
		</div>

		<span
			class="badge bg-primary-subtle text-primary"
			id="notification-count-in-page"
		>
			0 Notifications
		</span>
	</div>

	<div id="notification-list" class="d-flex flex-column gap-3">
		<!-- Notifications will be added here -->
	</div>
</div>
<!-- Notification page content  -->
