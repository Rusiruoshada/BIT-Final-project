<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Malinda Driving School</title>

		<link
			rel="stylesheet"
			href="../lib/bootstrap-5.3.8/css/bootstrap.min.css"
		/>

		<link
			rel="stylesheet"
			href="../lib/fontawesome-free-7.3.1/css/all.min.css"
		/>

		<link rel="stylesheet" href="../css/common.css" />
	</head>

	<body class="bg-body-secondary bg-opacity-50">
		<div class="d-flex min-vh-100">
			<aside
				class="d-none d-lg-block flex-shrink-0 sidebar-width"
				aria-label="Main navigation"
			>
				<div class="p-3 vh-100 overflow-y-auto sidebar" style="scrollbar-width: none;">
					<!-- sidebar logo  -->
					<header class="mb-5 sidebar-header">
						<h5 class="m-0 fw-bold text-white sidebar-title" id="sidebarLabel">
							<i class="fa-solid fa-motorcycle"></i>
							Malinda
						</h5>

						<span class="text-warning"> Driving School </span>
					</header>
					<!-- sidebar logo  -->

					<!-- Sidebar Navigation items -->
					<nav class="p-0 text-white sidebar-body">
						<ul class="m-0 p-0 list-unstyled" id="sidebar-navigation">
							<!--navbar items fill with js here -->
						</ul>
					</nav>
					<!-- Sidebar Navigation items -->
				</div>
			</aside>

			<div class="flex-grow-1 min-w-0 w-100">
				<!-- Top Navbar                     -->
				<header>
					<nav
						class="p-3 navbar navbar-light bg-white"
						aria-label="Top navigation"
					>
						<div class="container-fluid">
							<!-- Left Side -->
							<div class="d-flex gap-3 align-items-center">
								<!-- Mobile Sidebar Toggle -->
								<button
									type="button"
									class="d-lg-none p-1 navbar-toggler border-1"
									data-bs-toggle="offcanvas"
									data-bs-target="#offcanvasNavbar"
									aria-controls="offcanvasNavbar"
									aria-expanded="false"
									aria-label="Toggle navigation"
								>
									<span class="m-0 navbar-toggler-icon h6"></span>
								</button>

								<!-- Page Title -->
								<h6 class="m-0 navbar-brand fw-bold" id="navbarPageTitle"></h6>
							</div>
							<!-- Left Side -->

							<!-- Right Side -->
							<div class="d-flex gap-2 align-items-center">
								<!-- Notification Button -->
								<div class="dropdown">
									<button
										type="button"
										class="btn-bell btn rounded-circle text-secondary bg-body-secondary bg-opacity-50 position-relative"
										aria-label="Notifications"
										data-bs-toggle="dropdown"
										aria-expanded="false"
									>
										<i
											class="fa-solid fa-bell fa-swing h5"
											id="fa-bell-icon"
										></i>

										<span
											class="p-1 rounded-circle text-white fw-bold bg-danger notify-number"
											id="notification-count"
										>
											<!-- notification count will set by backend -->
										</span>
									</button>
									<ul
										class="dropdown-menu dropdown-menu-end border-0"
										id="notify-list"
										style="width: 400px"
									>
										<!-- notification will appear here -->

										<li class="p-2" id="open-notification">
											<button
												type="button"
												class="dropdown-item text-center bg-primary-subtle shadow rounded-pill"
												id="open-notification-button"
											>
												<i class="fa-regular fa-envelope-open"></i> Open
												Notification
											</button>
										</li>
									</ul>
								</div>
								<!-- Notification Button -->

								<!-- User Profile -->
								<div class="dropdown">
									<button
										type="button"
										class="d-flex gap-2 btn border-0 align-items-center"
										data-bs-toggle="dropdown"
										aria-expanded="false"
									>
										<img
											class="p-0 m-0 rounded-circle"
											src="../resources/images/profile-pic.jpeg"
											width="40"
											height="40"
											alt="profile-image"
										/>

										<span> Admin Diablo </span>

										<i class="fa-solid fa-chevron-down"></i>
									</button>

									<ul class="dropdown-menu dropdown-menu-end border-0">
										<li>
											<a
												href="#"
												class="d-flex gap-1 dropdown-item dropdown-menu-item-hover align-items-center text-secondary"
											>
												<i class="fa-solid fa-user"></i>
												<span>Profile</span>
											</a>
										</li>

										<li>
											<a
												href="#"
												class="d-flex gap-1 dropdown-item dropdown-menu-item-hover align-items-center text-secondary"
											>
												<i class="fa-solid fa-arrow-right-from-bracket"></i>
												<span>Logout</span>
											</a>
										</li>
									</ul>
								</div>
								<!-- User Profile -->
							</div>
							<!-- Right Side -->

							
							<!-- Mobile Offcanvas Sidebar      -->
							
							<div
								class="d-lg-none offcanvas offcanvas-start navbar-offcanvas"
								id="offcanvasNavbar"
								tabindex="-1"
								data-bs-scroll="true"
								style="--bs-offcanvas-width: 300px"
								aria-labelledby="offcanvasNavbarLabel"
							>
								<!-- Offcanvas Header -->
								<div class="offcanvas-header">
									<div>
										<h5
											class="offcanvas-title fw-bold text-white"
											id="offcanvasNavbarLabel"
										>
											<i class="fa-solid fa-motorcycle"></i>
											Malinda
										</h5>

										<span class="text-warning"> Driving School </span>
									</div>

									<button
										type="button"
										class="btn-close btn-close-white"
										data-bs-dismiss="offcanvas"
										aria-label="Close"
									></button>
								</div>

								<!-- Offcanvas Navigation -->
								<div class="p-3 offcanvas-body text-white fw-bold" style="scrollbar-width: none;">
									<nav aria-label="Mobile main navigation">
										<ul class="m-0 p-0 list-unstyled" id="offcanvas-navigation">
											<!--ITEMs FILL WITH JS FILE -->
										</ul>
									</nav>
								</div>
							</div>
						</div>
					</nav>
				</header>
				<!-- Top Navbar                     -->

				
				<!-- page Content                   -->
				
				<main id="app-content" class="p-3">
					<!-- dashboard content here -->

					<!-- dashboard content here -->
				</main>
			</div>
		</div>

		<!-- notification modal that open when click notifications -->

		<div class="notification-body">
			<div
				class="modal fade"
				id="notificationModal"
				tabindex="-1"
				aria-hidden="true"
			>
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="notificationModalTitle">
								<!-- notification title goes here -->
							</h5>

							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"
								id="btn-close-modal"
							></button>
						</div>

						<div class="modal-body" id="modal-body">
							<div class="d-flex justify-content-between">
								<div class="mb-3">
									<small class="text-muted"> Date </small>

									<div id="notificationModalDate" class="fw-medium">
										<!-- notification date goes here -->
									</div>
								</div>

								<div class="mb-3 text-end">
									<small class="text-muted"> Status </small>

									<div>
										<span
											id="notificationModalStatus"
											class="fw-bold text-black"
										>
											<!-- notification status goes here -->
										</span>
									</div>
								</div>
							</div>

							<div>
								<small class="text-muted"> Description </small>

								<p id="notificationModalDescription" class="mb-0">
									<!-- notification Description goes here -->
								</p>
							</div>
						</div>

						<div class="modal-footer">
							<!-- notification footer goes here -->
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- notification modal that open when click notifications -->

		<!-- Bootstrap js -->
		<script src="../lib/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>

		<!-- pageLoader js -->
		<script type="module" src="../js/pageLoader.js"></script>

		<!-- common js -->
		<script src="../js/common.js"></script>
	</body>
</html>
